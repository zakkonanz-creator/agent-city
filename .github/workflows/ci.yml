name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover tests -v
      - run: python build.py --demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: page script parses
        run: |
          python - <<'PY'
          s = open("dist/demo.html", encoding="utf-8").read()
          open("page.js", "w", encoding="utf-8").write(s[s.index("<script>") + 8:s.rindex("</script>")])
          PY
          node --check page.js
